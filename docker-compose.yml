services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gozaq-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/gozaq_db?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=production-secret-key-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gozaq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gozaq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gozaq_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gozaq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
