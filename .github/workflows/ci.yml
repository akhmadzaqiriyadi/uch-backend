name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install GolangCI-Lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.64.8 || go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Verify Code Formatting
        run: |
          gofmt -s -l . | tee fmt.log
          if [ -s fmt.log ]; then
            echo "Unformatted Go files detected"
            exit 1
          fi

      - name: Run GolangCI-Lint
        run: |
          golangci-lint run ./... || go vet ./...

      - name: Run Unit & Integration Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Binary Verification
        run: CGO_ENABLED=0 go build -ldflags="-w -s" -o /dev/null ./cmd/api
